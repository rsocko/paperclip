name: GHCR Codex gateway probe image

on:
  push:
    branches:
      - ghcr-build-codex-gateway-probe

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: b7620372dc8b4d02674113649a3c5181ac4ff943

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push tested production image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rsocko/paperclip:gateway-probe-b7620372d
          build-args: |
            PAPERCLIP_BUILD_COMMIT=b7620372dc8b4d02674113649a3c5181ac4ff943
          cache-from: type=registry,ref=ghcr.io/rsocko/paperclip:gateway-probe-buildcache
          cache-to: type=registry,ref=ghcr.io/rsocko/paperclip:gateway-probe-buildcache,mode=max

      - name: Publish digest
        run: echo "ghcr.io/rsocko/paperclip:gateway-probe-b7620372d@${{ steps.build.outputs.digest }}"
